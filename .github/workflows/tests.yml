name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-core.txt 'pytest>=8.3,<10' 'ruff>=0.11,<1'
      - run: ruff check .
      - run: python -m pytest
        env:
          SUMMARIZER_BACKEND: extractive

